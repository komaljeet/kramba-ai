# Local development. All published ports are bound to 127.0.0.1 only -
# see ISSUE_30_PLAN.md "Session Decisions" #4 (applies in dev too, not just prod).
# Build context is the repo root so the image can vendor ../hvn - run this
# compose file with `docker compose -f web/docker-compose.yml up` from the
# repo root, or `cd web && docker compose up` (context: .. handles the rest).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: web.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - checkpoints:/data/checkpoints
      # Dev hot-reload: bind-mount the Django project over the image's copy
      # so code edits (and generated migrations) land on the host, not just
      # inside the container's writable layer.
      - .:/srv/web
      - ../hvn:/srv/hvn

  app-worker:
    build:
      context: ..
      dockerfile: web/Dockerfile
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: web.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - checkpoints:/data/checkpoints
      - .:/srv/web
      - ../hvn:/srv/hvn
      - ../train.py:/srv/train.py:ro
      # Dev stand-in for the rsync/scp-to-server workflow (see
      # ISSUE_30_PLAN.md / prior session discussion): in production the
      # checkpoint is copied onto the `checkpoints` volume out of band, not
      # baked into the image. Locally, bind-mounting the repo's trained
      # checkpoints achieves the same thing without needing an actual rsync
      # round-trip.
      #
      # The #51 chat/base checkpoint is the one the app actually serves (a
      # BPE + Gated-DeltaNet model). Build it once on the host before
      # `docker compose up`:  python build_chat_checkpoint.py --out hvn_chat_checkpoint.pt
      # then register it as the active ModelVersion with checkpoint_path
      # /data/checkpoints/hvn_chat_checkpoint.pt (see web/README.md).
      - ../hvn_chat_checkpoint.pt:/data/checkpoints/hvn_chat_checkpoint.pt:ro
      - ../hvn_chat_checkpoint_tokenizer.json:/data/checkpoints/hvn_chat_checkpoint_tokenizer.json:ro
      # Legacy tiny char checkpoint, kept mounted for smoke/back-compat use.
      - ../hvn_checkpoint.pt:/data/checkpoints/hvn_checkpoint.pt:ro
      - ../hvn_checkpoint_tokenizer.json:/data/checkpoints/hvn_checkpoint_tokenizer.json:ro
      # EdgeHVN hybrid chat checkpoint (issue #97 Phase B / #108). No separate
      # tokenizer file -- EdgeHVN uses transformers.GPT2Tokenizer.from_pretrained
      # ("gpt2") directly (see hvn_worker/worker.py's _load_edgehvn). Register
      # as a ModelVersion with checkpoint_path=/data/checkpoints/hybrid_chat_v1.pt
      # and architecture="edgehvn".
      - ../checkpoints/hybrid_chat_v1.pt:/data/checkpoints/hybrid_chat_v1.pt:ro
    # GPU access for the HVN model - requires the NVIDIA Container Toolkit
    # on the Docker host. Remove this block to fall back to CPU inference.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Dedicated GPU training worker (Issue #57). Consumes ONLY the `training`
  # queue (docker-entrypoint.sh `train-worker` role), one job at a time, so an
  # hours-long in-app curriculum run never starves chat inference (app-worker,
  # the `celery` queue) and can't fight it for GPU memory. On a single-GPU box
  # both workers share the card; the one-job-at-a-time guard + separate queues
  # keep them from running heavy work simultaneously. Reuses auto_train.py + the
  # eval/ loaders, which the training task imports.
  app-train-worker:
    build:
      context: ..
      dockerfile: web/Dockerfile
    command: ["train-worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: web.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - checkpoints:/data/checkpoints
      - .:/srv/web
      - ../hvn:/srv/hvn
      - ../train.py:/srv/train.py:ro
      # In-app training reuses the curriculum orchestrator + dataset/eval pkg.
      - ../auto_train.py:/srv/auto_train.py:ro
      - ../eval:/srv/eval:ro
      # Same base checkpoints the inference worker mounts - a training run
      # continues from a registered ModelVersion (a checkpoint on this volume).
      - ../hvn_chat_checkpoint.pt:/data/checkpoints/hvn_chat_checkpoint.pt:ro
      - ../hvn_chat_checkpoint_tokenizer.json:/data/checkpoints/hvn_chat_checkpoint_tokenizer.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app-beat:
    build:
      context: ..
      dockerfile: web/Dockerfile
    command: ["beat"]
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: web.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/srv/web
      - ../hvn:/srv/hvn
    # Only schedules the daily purge task (api.tasks.purge_expired_conversations)
    # onto the queue - the actual task body runs in app-worker, so no GPU
    # needed here.

volumes:
  postgres_data:
  checkpoints:
